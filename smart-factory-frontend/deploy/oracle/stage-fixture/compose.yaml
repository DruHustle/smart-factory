{
  "name": "smart-factory-stage-fixture",
  "services": {
    "dashboard-db": {
      "image": "postgres:16-alpine",
      "environment": {"POSTGRES_USER": "fixture", "POSTGRES_PASSWORD": "synthetic-stage-only", "POSTGRES_DB": "dashboard_stage"},
      "volumes": ["dashboard-data:/var/lib/postgresql/data"],
      "networks": ["fixture"],
      "mem_limit": "192m",
      "cpus": 0.15,
      "healthcheck": {"test": ["CMD", "pg_isready", "-U", "fixture", "-d", "dashboard_stage"], "interval": "5s", "timeout": "3s", "retries": 30}
    },
    "telemetry-db": {
      "image": "postgres:16-alpine",
      "environment": {"POSTGRES_USER": "fixture", "POSTGRES_PASSWORD": "synthetic-stage-only", "POSTGRES_DB": "telemetry_stage"},
      "volumes": ["telemetry-data:/var/lib/postgresql/data"],
      "networks": ["fixture"],
      "mem_limit": "192m",
      "cpus": 0.15,
      "healthcheck": {"test": ["CMD", "pg_isready", "-U", "fixture", "-d", "telemetry_stage"], "interval": "5s", "timeout": "3s", "retries": 30}
    },
    "redis": {
      "image": "redis:8.2-alpine",
      "command": ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "32mb", "--maxmemory-policy", "noeviction"],
      "networks": ["fixture"],
      "mem_limit": "64m",
      "cpus": 0.10,
      "healthcheck": {"test": ["CMD", "redis-cli", "ping"], "interval": "5s", "timeout": "3s", "retries": 18}
    },
    "broker": {
      "image": "rabbitmq:4.3.6-management",
      "environment": {"RABBITMQ_DEFAULT_USER": "fixture", "RABBITMQ_DEFAULT_PASS": "synthetic-stage-only"},
      "command": ["sh", "-ec", "rabbitmq-plugins enable --offline rabbitmq_mqtt && exec rabbitmq-server"],
      "networks": ["fixture"],
      "mem_limit": "384m",
      "cpus": 0.20,
      "healthcheck": {"test": ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"], "interval": "5s", "timeout": "5s", "retries": 36}
    },
    "api": {
      "image": "${FACTORY_STAGE_IMAGE_ID:?Use the verified Linux ARM64 candidate image ID}",
      "platform": "linux/arm64",
      "pull_policy": "never",
      "init": true,
      "cap_drop": ["ALL"],
      "security_opt": ["no-new-privileges:true"],
      "networks": ["fixture"],
      "mem_limit": "896m",
      "cpus": 0.50,
      "environment": {
        "RENDER_SERVICE_ROLE": "web",
        "NODE_ENV": "development",
        "ASPNETCORE_ENVIRONMENT": "Development",
        "DOTNET_ENVIRONMENT": "Development",
        "PORT": "10000",
        "DATABASE_URL": "postgres://fixture:synthetic-stage-only@dashboard-db:5432/dashboard_stage",
        "DATABASE_SSL_MODE": "disable",
        "DATABASE_CA_CERT": "development-only-not-a-certificate",
        "DEVICE_DATABASE_CONNECTION": "Host=telemetry-db;Database=telemetry_stage;Username=fixture;Password=synthetic-stage-only;SSL Mode=Disable",
        "REDIS_URL": "redis://redis:6379",
        "JWT_SECRET": "isolated-stage-fixture-jwt-secret-not-live",
        "DASHBOARD_SERVICE_TOKEN": "isolated-stage-fixture-service-token-not-live",
        "AAS_PROVISIONING_TOKEN": "isolated-stage-fixture-provisioner-not-live",
        "INGESTION_API_TOKEN": "isolated-stage-fixture-ingestion-token-not-live",
        "ALLOWED_ORIGIN": "https://factory-stage-fixture.invalid",
        "PASSWORD_RESET_ORIGIN": "https://factory-stage-fixture.invalid",
        "EMAIL_DELIVERY_CONFIGURED": "false",
        "ENABLE_DEMO_ACCOUNTS": "false",
        "ENABLE_DEMO_DATA": "false",
        "AAS_ALLOW_UNAUTHENTICATED_LOCAL": "true",
        "AAS_REPOSITORY_URL": "http://127.0.0.1:9",
        "MqttBrokerHost": "broker",
        "MqttBrokerPort": "1883",
        "MqttUsername": "fixture",
        "MqttPassword": "synthetic-stage-only",
        "MqttUseTls": "false",
        "ASSISTANT_PROVIDER": "disabled"
      },
      "volumes": ["${FACTORY_STAGE_TLS_DIR:?Generate the stage-only TLS files}/ca.crt:/stage-trust/ca.crt:ro"],
      "depends_on": {"dashboard-db": {"condition": "service_healthy"}, "telemetry-db": {"condition": "service_healthy"}, "redis": {"condition": "service_healthy"}, "broker": {"condition": "service_healthy"}},
      "healthcheck": {"test": ["CMD", "curl", "--fail", "--silent", "--max-time", "4", "http://127.0.0.1:10000/health/ready"], "interval": "10s", "timeout": "6s", "start_period": "45s", "retries": 30}
    },
    "stage-proxy": {
      "image": "caddy:2.10-alpine",
      "depends_on": {"api": {"condition": "service_healthy"}},
      "volumes": [
        "./Caddyfile:/etc/caddy/Caddyfile:ro",
        "${FACTORY_STAGE_TLS_DIR:?Generate the stage-only TLS files}/proxy.crt:/stage-tls/proxy.crt:ro",
        "${FACTORY_STAGE_TLS_DIR:?Generate the stage-only TLS files}/proxy.key:/stage-tls/proxy.key:ro"
      ],
      "cap_drop": ["ALL"],
      "security_opt": ["no-new-privileges:true"],
      "networks": ["fixture"],
      "mem_limit": "96m",
      "cpus": 0.10
    },
    "worker": {
      "image": "${FACTORY_STAGE_IMAGE_ID:?Use the verified Linux ARM64 candidate image ID}",
      "platform": "linux/arm64",
      "pull_policy": "never",
      "init": true,
      "cap_drop": ["ALL"],
      "security_opt": ["no-new-privileges:true"],
      "networks": ["fixture"],
      "mem_limit": "640m",
      "cpus": 0.35,
      "environment": {
        "RENDER_SERVICE_ROLE": "worker",
        "NODE_ENV": "development",
        "ASPNETCORE_ENVIRONMENT": "Development",
        "DOTNET_ENVIRONMENT": "Development",
        "PORT": "10000",
        "DATABASE_URL": "postgres://fixture:synthetic-stage-only@dashboard-db:5432/dashboard_stage",
        "DATABASE_SSL_MODE": "disable",
        "DATABASE_CA_CERT": "development-only-not-a-certificate",
        "TELEMETRY_DATABASE_CONNECTION": "Host=telemetry-db;Database=telemetry_stage;Username=fixture;Password=synthetic-stage-only;SSL Mode=Disable",
        "DASHBOARD_SERVICE_TOKEN": "isolated-stage-fixture-service-token-not-live",
        "INGESTION_API_TOKEN": "isolated-stage-fixture-ingestion-token-not-live",
        "DASHBOARD_API_ORIGIN": "https://stage-proxy:8443",
        "SSL_CERT_FILE": "/stage-trust/ca.crt",
        "NODE_EXTRA_CA_CERTS": "/stage-trust/ca.crt",
        "EMAIL_DELIVERY_CONFIGURED": "false",
        "ENABLE_DEMO_ACCOUNTS": "false",
        "ENABLE_DEMO_DATA": "false",
        "MqttBrokerHost": "broker",
        "MqttBrokerPort": "1883",
        "MqttUsername": "fixture",
        "MqttPassword": "synthetic-stage-only",
        "MqttUseTls": "false",
        "MqttClientId": "smart-factory-isolated-stage-fixture",
        "ASSISTANT_PROVIDER": "disabled"
      },
      "volumes": ["${FACTORY_STAGE_TLS_DIR:?Generate the stage-only TLS files}/ca.crt:/stage-trust/ca.crt:ro"],
      "depends_on": {"api": {"condition": "service_healthy"}, "stage-proxy": {"condition": "service_started"}},
      "healthcheck": {"test": ["CMD", "curl", "--fail", "--silent", "--max-time", "4", "http://127.0.0.1:10000/health/ready"], "interval": "10s", "timeout": "6s", "start_period": "45s", "retries": 30}
    }
  },
  "networks": {"fixture": {"internal": true}},
  "volumes": {"dashboard-data": {}, "telemetry-data": {}}
}
