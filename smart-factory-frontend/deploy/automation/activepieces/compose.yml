name: smart-factory-activepieces

x-activepieces-environment: &activepieces-environment
  AP_DB_TYPE: POSTGRES
  AP_POSTGRES_HOST: postgres
  AP_POSTGRES_PORT: "5432"
  AP_POSTGRES_DATABASE: ${AP_POSTGRES_DATABASE:?Set database name}
  AP_POSTGRES_USERNAME: ${AP_POSTGRES_USERNAME:?Set database user}
  AP_POSTGRES_PASSWORD: ${AP_POSTGRES_PASSWORD:?Set database password}
  AP_REDIS_TYPE: DEFAULT
  AP_REDIS_HOST: redis
  AP_REDIS_PORT: "6379"
  AP_REDIS_PASSWORD: ${AP_REDIS_PASSWORD:?Set redis password}
  AP_ENCRYPTION_KEY: ${AP_ENCRYPTION_KEY:?Set stable encryption key}
  AP_JWT_SECRET: ${AP_JWT_SECRET:?Set stable JWT secret}
  AP_FRONTEND_URL: ${AP_FRONTEND_URL:?Set reviewed HTTPS origin}
  AP_EDITION: ce
  AP_EXECUTION_MODE: SANDBOX_CODE_ONLY
  AP_LOG_LEVEL: info

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AP_POSTGRES_DATABASE:?Set database name}
      POSTGRES_USER: ${AP_POSTGRES_USERNAME:?Set database user}
      POSTGRES_PASSWORD: ${AP_POSTGRES_PASSWORD:?Set database password}
    volumes:
      - activepieces_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [automation]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDISCLI_AUTH: ${AP_REDIS_PASSWORD:?Set redis password}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${AP_REDIS_PASSWORD:?Set redis password}
    volumes:
      - activepieces_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [automation]

  app:
    image: ${ACTIVEPIECES_IMAGE:?Use an approved pinned version or digest}
    restart: unless-stopped
    environment:
      <<: *activepieces-environment
      AP_CONTAINER_TYPE: APP
    ports:
      - "127.0.0.1:${ACTIVEPIECES_HOST_PORT:-8080}:80"
    volumes:
      - activepieces_cache:/usr/src/app/cache
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:80/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 20
    networks: [automation]

  worker:
    image: ${ACTIVEPIECES_IMAGE:?Use the same reviewed pinned image}
    restart: unless-stopped
    environment:
      AP_CONTAINER_TYPE: WORKER
      AP_FRONTEND_URL: http://app
      AP_WORKER_TOKEN: ${AP_WORKER_TOKEN:?Create a worker token with the Activepieces CLI}
      AP_WORKER_CONCURRENCY: "1"
      AP_REUSE_SANDBOX: "true"
      AP_EXECUTION_MODE: SANDBOX_CODE_ONLY
    volumes:
      - activepieces_cache:/usr/src/app/cache
    depends_on:
      app: { condition: service_healthy }
    networks: [automation]

volumes:
  activepieces_postgres:
  activepieces_redis:
  activepieces_cache:

networks:
  automation:
    driver: bridge
