name: smart-factory-activepieces

x-activepieces-environment: &activepieces-environment
  AP_DB_TYPE: POSTGRES
  AP_POSTGRES_HOST: postgres
  AP_POSTGRES_PORT: "5432"
  AP_POSTGRES_DATABASE: ${AP_POSTGRES_DATABASE:?Set AP_POSTGRES_DATABASE}
  AP_POSTGRES_USERNAME: ${AP_POSTGRES_USERNAME:?Set AP_POSTGRES_USERNAME}
  AP_POSTGRES_PASSWORD: ${AP_POSTGRES_PASSWORD:?Set AP_POSTGRES_PASSWORD}
  AP_REDIS_HOST: redis
  AP_REDIS_PORT: "6379"
  AP_REDIS_PASSWORD: ${AP_REDIS_PASSWORD:?Set AP_REDIS_PASSWORD}
  AP_ENCRYPTION_KEY: ${AP_ENCRYPTION_KEY:?Set AP_ENCRYPTION_KEY}
  AP_JWT_SECRET: ${AP_JWT_SECRET:?Set AP_JWT_SECRET}
  AP_FRONTEND_URL: ${AP_FRONTEND_URL:?Set AP_FRONTEND_URL}
  AP_WEBHOOK_URL: ${AP_WEBHOOK_URL:?Set AP_WEBHOOK_URL}
  AP_EXECUTION_MODE: SANDBOX_CODE_ONLY
  AP_LOG_LEVEL: info

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AP_POSTGRES_DATABASE:?Set AP_POSTGRES_DATABASE}
      POSTGRES_USER: ${AP_POSTGRES_USERNAME:?Set AP_POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${AP_POSTGRES_PASSWORD:?Set AP_POSTGRES_PASSWORD}
    volumes:
      - activepieces_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [automation]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${AP_REDIS_PASSWORD:?Set AP_REDIS_PASSWORD}
    volumes:
      - activepieces_redis:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$$AP_REDIS_PASSWORD\" ping | grep -q PONG",
        ]
      environment:
        AP_REDIS_PASSWORD: ${AP_REDIS_PASSWORD:?Set AP_REDIS_PASSWORD}
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [automation]

  app:
    image: ${ACTIVEPIECES_IMAGE:-ghcr.io/activepieces/activepieces:0.92.3-hotfix.2}
    restart: unless-stopped
    environment:
      <<: *activepieces-environment
      AP_CONTAINER_TYPE: APP
    ports:
      - "127.0.0.1:${ACTIVEPIECES_HOST_PORT:-8080}:80"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:80/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 20
    networks: [automation]

  worker:
    image: ${ACTIVEPIECES_IMAGE:-ghcr.io/activepieces/activepieces:0.92.3-hotfix.2}
    restart: unless-stopped
    environment:
      <<: *activepieces-environment
      AP_CONTAINER_TYPE: WORKER
      AP_FRONTEND_URL: http://app
      AP_WORKER_CONCURRENCY: ${AP_WORKER_CONCURRENCY:-2}
    depends_on:
      app: { condition: service_healthy }
    networks: [automation]

volumes:
  activepieces_postgres:
  activepieces_redis:

networks:
  automation:
    driver: bridge
