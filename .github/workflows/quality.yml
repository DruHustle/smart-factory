name: Monorepo quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend type, unit and build checks
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: smart-factory-frontend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smart_factory_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d smart_factory_e2e"
          --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/smart_factory_e2e
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/smart_factory_e2e
      DATABASE_SSL_MODE: disable
      VITEST_MAX_WORKERS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with: { version: 10.34.5 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: smart-factory-frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec drizzle-kit migrate
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: Validate deployment origin and target preparation
        run: |
          python3 -m unittest discover -s scripts/tests -p test_deploy_vm.py
          python3 -m unittest discover -s scripts/tests -p test_manual_deployment.py

  backend:
    name: Backend tests and dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: smart-factory-backend
    services:
      dashboard-storage:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: smart_factory_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DASHBOARD_DATABASE_CONNECTION: Host=127.0.0.1;Port=5432;Database=smart_factory_e2e;Username=postgres;Password=postgres;SSL Mode=Disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with: { dotnet-version: 10.0.403 }
      - name: Validate optional migration configuration without starting services
        run: python3 scripts/test_onesa_migration_config.py --require-compose
      - run: dotnet restore src/SmartFactory.sln -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=high -warnaserror:NU1900,NU1903,NU1904 --force-evaluate
      - run: dotnet test src/SmartFactory.sln -c Release --no-restore

  edge:
    name: Gateway tests and firmware build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: smart-factory-edge
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.11" }
      - run: python -m pip install --require-hashes -r raspberry-pi/requirements.txt
      - run: python -m pip install platformio==6.2.0 pip-audit==2.10.1
      - run: python -m pip_audit -r raspberry-pi/requirements.txt --strict --progress-spinner off
      - run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s raspberry-pi/tests -v
      - name: Validate optional Node-RED and Activepieces configuration
        env:
          NODE_RED_IMAGE: nodered/node-red:4.1.9
          NODE_RED_CREDENTIAL_SECRET: isolated-test-only-node-red-secret-12345678
          NODE_RED_ADMIN_USER: test-operator
          NODE_RED_ADMIN_PASSWORD_HASH: '$2b$12$AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA'
          ACTIVEPIECES_IMAGE: ghcr.io/activepieces/activepieces:0.92.2
          AP_POSTGRES_DATABASE: isolated_automation
          AP_POSTGRES_USERNAME: isolated_automation
          AP_POSTGRES_PASSWORD: isolated-postgres-secret
          AP_REDIS_PASSWORD: isolated-redis-secret
          AP_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
          AP_JWT_SECRET: isolated-jwt-secret-32-characters-plus
          AP_FRONTEND_URL: https://automation.example.test
          AP_WORKER_TOKEN: isolated-worker-token
        run: |
          node --check deploy/node-red/settings.js
          python3 -m json.tool deploy/node-red/flows.example.json > /dev/null
          docker compose -f deploy/node-red/compose.yml config --quiet
          docker compose -f ../smart-factory-frontend/deploy/automation/activepieces/compose.yml config --quiet
      - run: pio run --project-dir esp32-wrover --environment compile-check
