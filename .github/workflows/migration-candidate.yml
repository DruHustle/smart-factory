name: Prepare inert workflow migration objects
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/migration-candidate.yml
      - scripts/consolidate_workflows.py
      - scripts/tests/**
permissions:
  contents: read
jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == 'DruHustle/smart-factory' && github.event.pull_request.head.ref == 'fix/consolidated-release-20261104'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: 'python3 -m pip install --only-binary=:all: PyYAML==6.0.3'
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: python3 scripts/consolidate_workflows.py --write
      - run: python3 scripts/consolidate_workflows.py --check
      - name: Adapt rollback source reader without weakening image verification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('smart-factory-frontend/scripts/bundle-smoke.py')
          text=path.read_text()
          old="rollback_sources=json.loads((ROOT/'deploy/rollback-sources.json').read_text())"
          new='rollback_sources=load_rollback_sources(ROOT)'
          if old in text:
              assert text.count(old)==1
              text=text.replace(old,new)
              text=text.replace('from pathlib import Path\n','from pathlib import Path\nfrom qualification.source_revisions import load_rollback_sources\n',1)
              path.write_text(text)
          else:
              assert new in text and 'from qualification.source_revisions import load_rollback_sources' in text
          PY
          python3 -m unittest discover -s smart-factory-frontend/scripts/tests -p test_source_revisions.py -v
          python3 -m py_compile smart-factory-frontend/scripts/bundle-smoke.py
      - name: Store content-addressed review blobs only
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,subprocess
          from pathlib import Path
          sha=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          assert sha==os.environ['EXPECTED_SHA']
          paths=['.github/workflows/'+name for name in ('frontend-quality.yml','documentation-artifacts.yml','renderer-quality.yml')]
          paths.append('smart-factory-frontend/scripts/bundle-smoke.py')
          for path in paths:
              content=Path(path).read_text()
              result=subprocess.run(['gh','api','--method','POST','repos/DruHustle/smart-factory/git/blobs','--input','-'],input=json.dumps({'content':content,'encoding':'utf-8'}),text=True,capture_output=True)
              if result.returncode:
                  print(result.stderr)
                  print(result.stdout)
                  raise SystemExit(result.returncode)
              blob=json.loads(result.stdout)['sha']
              expected=hashlib.sha1(('blob '+str(len(content.encode()))+'\0').encode()+content.encode()).hexdigest()
              assert blob==expected
              print(json.dumps({'parent':sha,'path':path,'blob':blob,'sha256':hashlib.sha256(content.encode()).hexdigest(),'branchesChanged':False,'productionChanged':False}),flush=True)
          PY
