# Generated by scripts/consolidate_workflows.py; run --write after changing a compatibility template.
name: Factory Render engineering documentation
'on':
  pull_request:
    branches:
    - main
    paths:
    - smart-factory-frontend/docs/**/*.md
    - smart-factory-frontend/scripts/render-pdfs.mjs
    - smart-factory-frontend/package.json
    - smart-factory-frontend/pnpm-lock.yaml
    - smart-factory-frontend/.github/workflows/documentation-artifacts.yml
    - .github/workflows/**
    - scripts/consolidate_workflows.py
  workflow_dispatch: null
  push:
    branches:
    - main
permissions:
  contents: read
concurrency:
  group: engineering-docs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      with:
        version: 10.34.5
        package_json_file: smart-factory-frontend/package.json
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: smart-factory-frontend/pnpm-lock.yaml
    - run: pnpm install --frozen-lockfile
    - run: pnpm exec playwright install --with-deps chromium
    - name: Install document converter
      run: |
        sudo apt-get update
        sudo apt-get install --yes pandoc
    - name: Render canonical guides and diagrams
      run: pnpm docs:pdf
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: rendered-engineering-docs
        path: |
          smart-factory-frontend/docs/architecture.pdf
          smart-factory-frontend/docs/api-flows.pdf
          smart-factory-frontend/docs/database-schema.pdf
          smart-factory-frontend/docs/fx-tsn.pdf
          smart-factory-frontend/docs/pdf-manifest.json
          smart-factory-frontend/docs/diagrams/architecture.svg
          smart-factory-frontend/docs/diagrams/architecture.png
          smart-factory-frontend/docs/diagrams/fx-tsn.svg
          smart-factory-frontend/docs/diagrams/fx-tsn.png
        if-no-files-found: error
        retention-days: 7
defaults:
  run:
    working-directory: smart-factory-frontend
    shell: bash
