# Generated by scripts/consolidate_workflows.py; run --write after changing a compatibility template.
name: Factory Native 3D rendering
'on':
  pull_request:
    paths:
    - smart-factory-frontend/client/src/components/equipment/**
    - smart-factory-frontend/client/src/assets/equipment/**
    - smart-factory-frontend/scripts/equipment/**
    - smart-factory-frontend/.github/workflows/renderer-quality.yml
    - .github/workflows/**
    - scripts/consolidate_workflows.py
  workflow_dispatch: null
  push:
    branches:
    - main
permissions:
  contents: read
jobs:
  renderer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
    - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
      with:
        version: 10.34.5
        package_json_file: smart-factory-frontend/package.json
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: smart-factory-frontend/pnpm-lock.yaml
    - run: pnpm install --frozen-lockfile
    - run: pnpm exec playwright install --with-deps chromium
    - name: Verify real models, previews, lighting fallback and inspection
      run: node scripts/equipment/qualify-rendering.mjs
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: always()
      with:
        name: native-3d-rendering
        path: |
          smart-factory-frontend/test-results/rendering/**/*.json
          smart-factory-frontend/test-results/rendering/**/*.log
          smart-factory-frontend/test-results/rendering/**/*.txt
          smart-factory-frontend/test-results/rendering/**/*.md
          smart-factory-frontend/test-results/rendering/**/*.xml
          smart-factory-frontend/test-results/rendering/**/*.csv
          smart-factory-frontend/test-results/rendering/**/*.tsv
          smart-factory-frontend/test-results/rendering/**/*.dxf
          smart-factory-frontend/test-results/rendering/**/*.sha256
defaults:
  run:
    working-directory: smart-factory-frontend
    shell: bash
